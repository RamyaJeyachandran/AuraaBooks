<!-- Navigation Items -->
<div class="space-y-1">
    {% for parent in sidebar_modules %}
        {% if not parent.children %}
            <!-- Single Menu -->
            <a href="{% if parent.route_path %}{{ parent.route_path }}{% else %}#{% endif %}" title="{{ parent.module_name }}" class="nav-item flex items-center gap-3 px-4 py-3 cursor-pointer transition-all duration-200 relative group/item [transform-style:preserve-3d] z-10 text-white hover:bg-white/5 rounded-xl {% if request.path == parent.route_path %}active{% endif %}">
                <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center bg-white/10 text-white">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        {% if parent.icon_name == 'dashboard' %}
                            <path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zm0 11h7v7h-7v-7zm-11 0h7v7H3v-7z"/>
                        {% elif parent.icon_name == 'bank' %}
                            <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
                        {% elif parent.icon_name == 'project' %}
                            <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h6v6h-6z"/>
                        {% elif parent.icon_name == 'settings' %}
                            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        {% else %}
                            <path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zm0 11h7v7h-7v-7zm-11 0h7v7H3v-7z"/>
                        {% endif %}
                    </svg>
                </div>
                <span class="text-[13px] flex-1 font-medium">{{ parent.module_name }}</span>
            </a>
            {% if not forloop.last %}<div class="h-1"></div>{% endif %}
        {% else %}
            <!-- Parent Menu with Children -->
            <div class="nav-group">
                <div title="{{ parent.module_name }}" class="nav-parent flex items-center gap-3 px-4 py-3 cursor-pointer transition-all duration-200 relative group/item [transform-style:preserve-3d] z-10 text-white hover:bg-white/5 rounded-xl" onclick="toggleNavGroup(this)">
                    <div class="nav-icon w-7 h-7 rounded-lg flex items-center justify-center bg-white/10 text-white">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                            {% if parent.icon_name == 'masters' %}
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            {% elif parent.icon_name == 'sales' %}
                                <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2m4 0v2m0 4v.01M8 4h8a2 2 0 012 2v2H6V6a2 2 0 012-2z"/>
                            {% elif parent.icon_name == 'purchase' %}
                                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                            {% elif parent.icon_name == 'expenses' %}
                                <path d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zM12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/>
                            {% elif parent.icon_name == 'accounting' %}
                                <rect x="2" y="4" width="20" height="16" rx="2" /><line x1="2" y1="10" x2="22" y2="10" /><line x1="7" y1="15" x2="7" y2="15.01" /><line x1="12" y1="15" x2="12" y2="15.01" /><line x1="17" y1="15" x2="17" y2="15.01" />
                            {% else %}
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            {% endif %}
                        </svg>
                    </div>
                    <span class="text-[13px] flex-1 font-medium">{{ parent.module_name }}</span>
                    <svg class="w-3 h-3 transition-transform chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </div>
                <div class="nav-children mt-1 space-y-1 ml-6 mr-1 overflow-hidden transition-all duration-300 relative z-20 max-h-0">
                    {% for child in parent.children %}
                        <a href="{% if child.route_path %}{{ child.route_path }}{% else %}#{% endif %}" class="block px-4 py-2 text-[12px] cursor-pointer rounded-xl transition-all duration-150 relative ml-4 mb-0.5 text-white hover:bg-white/5 {% if request.path == child.route_path %}active-child{% endif %}">{{ child.module_name }}</a>
                    {% endfor %}
                </div>
            </div>
            {% if not forloop.last %}<div class="h-1"></div>{% endif %}
        {% endif %}
    {% endfor %}
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentPath = window.location.pathname;
        
        // Single menu items
        const singleItems = document.querySelectorAll('.nav-item');
        singleItems.forEach(item => {
            const href = item.getAttribute('href');
            if (href === currentPath || (href !== '/' && href !== '#' && currentPath.startsWith(href))) {
                item.classList.add('active');
            }
        });

        // Children links
        const childrenLinks = document.querySelectorAll('.nav-children a');
        childrenLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath || (link.getAttribute('href') !== '/' && currentPath.startsWith(link.getAttribute('href')))) {
                link.classList.add('active-child');
                const parentGroup = link.closest('.nav-group');
                if (parentGroup) {
                    const parentDiv = parentGroup.querySelector('.nav-parent');
                    parentDiv.classList.add('active-parent');
                    const chevron = parentGroup.querySelector('.chevron');
                    if (chevron) chevron.classList.add('rotate-90');
                    const childrenDiv = parentGroup.querySelector('.nav-children');
                    if (childrenDiv) childrenDiv.classList.remove('max-h-0');
                }
            }
        });
    });
</script>
